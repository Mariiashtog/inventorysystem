<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин · Дизайн + Backend</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="shop-header">
        <h1>🛍️ Дизайн-маркет</h1>
        <div style="display: flex; gap: 10px;">
            <button class="add-btn" id="openCatModalBtn" style="background: #4a5568;">Категорії</button>
            <button class="add-btn" id="openModalBtn">+ Додати товар</button>
        </div>
    </div>

    <div class="filters-section">
        <input type="text" id="searchInput" placeholder="🔍 Пошук за назвою..." class="search-input">
        <select id="categoryFilter" class="category-filter">
            <option value="">Всі категорії</option>
        </select>
        <button id="resetFiltersBtn" class="reset-btn">Скинути</button>
    </div>

    <div id="productsContainer" class="products-grid">
    </div>

    <footer>
        ⚡ Backend + Frontend | Товари зберігаються на сервері
    </footer>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle">➕ Новий товар</h3>
        <input type="hidden" id="productId">

        <label>Назва товару *</label>
        <input type="text" id="productName">

        <label>Ціна (грн) *</label>
        <input type="number" id="productPrice">

        <label>Категорія *</label>
        <select id="productCategory">
        </select>

        <label>Кількість</label>
        <input type="number" id="productQuantity" value="1">

        <div class="modal-actions">
            <button class="cancel-btn" id="closeModalBtn">Скасувати</button>
            <button class="save-btn" id="saveProductBtn">Зберегти →</button>
        </div>
    </div>
</div>

<div id="categoryModal" class="modal">
    <div class="modal-content">
        <h3>Управління категоріями</h3>

        <label>Додати нову</label>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input type="text" id="newCategoryName" placeholder="Назва категорії">
            <button class="save-btn" id="addCategoryBtn">Додати</button>
        </div>

        <label>Редагувати / Видалити</label>
        <select id="editCategorySelect" style="margin-bottom: 10px; width: 100%;"></select>
        <input type="text" id="editCategoryName" placeholder="Нова назва" style="margin-bottom: 10px;">
        <div style="display: flex; gap: 10px;">
            <button class="save-btn" id="updateCategoryBtn">Оновити</button>
            <button class="cancel-btn" id="deleteCategoryBtn" style="background: #ff4d4f; color: white;">Видалити</button>
        </div>

        <div class="modal-actions" style="margin-top: 20px;">
            <button class="cancel-btn" id="closeCatModalBtn">Закрити</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
